<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Форма — учебный прототип записи</title><link rel="stylesheet" href="styles.css"><style>.booking-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.booking-list{display:grid;gap:12px}.booking-list .card{display:flex;align-items:center;justify-content:space-between;gap:16px}.booking-list h3{margin:0}.booking-list p{margin:8px 0}@media(max-width:650px){.booking-grid{grid-template-columns:1fr}.booking-list .card{display:block}}</style></head><body>
<header class="header"><a class="brand" href="case.html">форма.</a><span>Учебный прототип · реальные услуги не бронируются</span></header><main>
<span class="eyebrow muted" id="variant"></span><h1 class="page-title">Время для творчества.</h1><p class="muted">Выберите свободный мастер-класс. Записи сохраняются только в этом браузере. Персональные данные не нужны.</p><p id="booking-status" role="status" aria-live="polite"></p><section id="sessions" aria-label="Доступные сеансы"></section><section class="panel" style="margin-top:28px"><h2>Ваши записи</h2><div id="bookings"></div></section><p><a class="text-link" href="case.html">← К сценарию защиты</a></p></main>
<script>
const list=new URLSearchParams(location.search).get('variant')==='list';
document.querySelector('#variant').textContent=list?'Вектор · вариант со списком':'Orbit · вариант с сеткой';
const sessions=[['Керамика','Суббота · 10:00'],['Акварель','Суббота · 12:00'],['Керамика','Суббота · 14:00'],['Линогравюра','Воскресенье · 10:00'],['Акварель','Воскресенье · 12:00'],['Линогравюра','Воскресенье · 14:00']];
const key='most-booking-prototype-'+(list?'list':'grid');let booked=[];
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))booked=saved.filter(v=>Number.isInteger(v)&&v>=0&&v<sessions.length);}catch{}
const status=document.querySelector('#booking-status');
function draw(){const host=document.querySelector('#sessions');host.className=list?'booking-list':'booking-grid';host.innerHTML=sessions.map(([name,time],i)=>'<article class="card"><div><h3>'+name+'</h3><p>'+time+'</p><span class="tag">'+(booked.includes(i)?'Занято':'1 место')+'</span></div><button class="btn" type="button" data-book="'+i+'" '+(booked.includes(i)?'disabled':'')+'>'+ (booked.includes(i)?'Уже записаны':'Записаться')+'</button></article>').join('');document.querySelector('#bookings').innerHTML=booked.length?booked.map(i=>'<div class="selection-bar"><span>'+sessions[i].join(' · ')+'</span><button class="btn secondary small" type="button" data-cancel="'+i+'">Отменить запись</button></div>').join(''):'<p class="muted">Пока нет записей.</p>';}
document.addEventListener('click',event=>{const button=event.target.closest('[data-book],[data-cancel]');if(!button)return;const cancel=button.hasAttribute('data-cancel'),id=Number(button.dataset.cancel??button.dataset.book);if(!cancel&&booked.includes(id)){status.textContent='Сеанс уже занят.';return;}const next=cancel?booked.filter(v=>v!==id):[...booked,id];try{localStorage.setItem(key,JSON.stringify(next));booked=next;status.textContent=cancel?'Запись отменена. Сеанс снова свободен.':'Вы записаны. Запись сохранена в этом браузере.';draw();}catch{status.textContent='Не удалось сохранить запись. Разрешите хранение данных в браузере.';}});draw();
</script></body></html>
